name: Build Aurora OS for Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest tests -q
      - run: pyinstaller build/aurora_os.spec --noconfirm
      - name: Make the installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-Windows
          path: |
            dist/AuroraOS-Setup.exe
            dist/AuroraOS
